<script>
  (function initTelemetry() {
    const clockEl = document.getElementById('live-est-clock');
    const statusTextEl = document.getElementById('vault-status-text');
    const percentageEl = document.getElementById('vault-percentage');

    function updateClock() {
      if (!clockEl) return;
      try {
        const now = new Date();
        const estTime = now.toLocaleTimeString('en-US', {
          timeZone: 'America/New_York',
          hour12: false,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        clockEl.textContent = estTime + ' EST';
      } catch (e) {
        // Fallback gracefully
        const d = new Date();
        clockEl.textContent = d.toTimeString().split(' ')[0] + ' UTC';
      }
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Subtle initialization state cycle
    const states = [
      { text: "INITIALIZING TAMPER-RESISTANT VAULT...", pct: "78%" },
      { text: "VERIFYING BIOMETRIC HASH REGISTRY...", pct: "89%" },
      { text: "ESTABLISHING CROSS-BORDER SYNCHRONY...", pct: "96%" },
      { text: "LEDGER SESSION AUTHENTICATED", pct: "100%" }
    ];

    let stateIdx = 0;
    setInterval(function() {
      if (stateIdx < states.length - 1) {
        stateIdx++;
        if (statusTextEl) statusTextEl.textContent = states[stateIdx].text;
        if (percentageEl) percentageEl.textContent = states[stateIdx].pct;
      }
    }, 1800);
  })();
</script></main>
